name: Verify browser environment
on:
  push:
    branches: [cartoon-quest-v2]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4182 >/tmp/game-preview.log 2>&1 &
          sleep 3
          node scripts/capture-tutor.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hiyori-render
          path: |
            game/public/assets/hiyori-guide.png
            game/output/quest/
