<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3ebe0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>nanoGPT 闯关</title>
    <link rel="icon" href="./assets/robot.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="app-layout">
      <div id="game-shell">
        <button
          type="button"
          id="mute-toggle"
          class="mute-toggle"
          aria-label="静音"
          aria-pressed="false"
          title="静音"
        >
          <svg class="mute-toggle__speaker" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3.5 9.2h3.1L11 5.4v13.2L6.6 14.8H3.5V9.2z"
              fill="currentColor"
            />
            <path
              class="mute-toggle__waves"
              d="M14.2 8.4a4.2 4.2 0 0 1 0 7.2M16.8 6.2a7.2 7.2 0 0 1 0 11.6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
          <span class="mute-toggle__slash" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          id="notes-toggle"
          class="notes-toggle"
          aria-label="看不懂？"
          aria-expanded="false"
          aria-controls="notes-overlay"
          title="看不懂？"
        >
          看不懂？
        </button>
        <div id="game"></div>
      </div>
      <aside id="tutor-dock" hidden>
        <div class="tutor-bubble">
          <p class="tutor-kicker">这一步在干什么</p>
          <p id="tutor-purpose" class="tutor-purpose">点下一步，我跟着讲</p>
          <p id="tutor-caption" class="tutor-caption">宽屏才出现助教</p>
          <p id="tutor-step" class="tutor-step"></p>
        </div>
        <div id="tutor-stage">
          <canvas id="tutor-canvas"></canvas>
        </div>
      </aside>
    </div>
    <div id="notes-overlay" hidden>
      <div class="notes-card" role="dialog" aria-modal="true" aria-labelledby="notes-title">
        <header class="notes-head">
          <h2 id="notes-title">这些词是什么意思</h2>
          <button type="button" id="notes-close" class="notes-close" aria-label="关闭">关闭</button>
        </header>
        <ul id="notes-list" class="notes-list"></ul>
        <div class="notes-detail-box">
          <p id="notes-detail-term" class="notes-detail-term">BPE</p>
          <p id="notes-detail" class="notes-detail">点一个词看说明</p>
        </div>
      </div>
    </div>
    <div id="game-cursor" hidden aria-hidden="true">
      <svg class="game-cursor__pointer" viewBox="0 0 36 44" width="36" height="44">
        <path
          d="M4 3 L4 34 L12.2 26.2 L18.8 41.2 L24.4 38.8 L17.8 24.2 L28 24.2 Z"
          fill="#fff8ee"
          stroke="#3b2a2e"
          stroke-width="3.2"
          stroke-linejoin="round"
        />
        <path d="M8.2 9.2 L8.2 23.6 L13.2 19.2" fill="#ff7a85" />
      </svg>
    </div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-label">加载中…</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
